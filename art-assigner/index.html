<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="description" content="Ignite — a random art task assigner that matches a creative exercise, inspiration words and a color palette to your fire level and medium.">
  <title>Ignite — Art Task Assigner</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
          <path d="M13.5 1.5c.6 3-1 4.6-2.6 6.1C9.1 9.3 7.4 11 7.4 13.8a4.6 4.6 0 0 0 1.5 3.4c-.2-.5-.3-1-.3-1.6 0-1.6 1-2.7 2-3.7.4 2 1.6 2.7 2.4 3.6.8.9 1.3 1.8 1.3 3a3.2 3.2 0 0 1-.6 1.9A5.8 5.8 0 0 0 17.9 13c0-3.2-2-5-3.2-6.7-1-1.4-1.6-3-1.2-4.8Z"/>
        </svg>
      </span>
      <div>
        <h1>Ignite</h1>
        <p class="tagline">Catch fire. Make something.</p>
      </div>
    </div>
    <button id="streak-chip" class="streak-chip" title="Your current streak">
      <span class="flame">🔥</span><span id="streak-chip-count">0</span>
    </button>
  </header>

  <nav class="tab-bar" role="tablist">
    <button class="tab-btn active" data-tab="create" role="tab">✦ Create</button>
    <button class="tab-btn" data-tab="calendar" role="tab">◆ Calendar</button>
    <button class="tab-btn" data-tab="log" role="tab">☰ Log</button>
    <button class="tab-btn" data-tab="settings" role="tab">⚙ Settings</button>
  </nav>

  <main>
    <!-- ============ CREATE ============ -->
    <section id="tab-create" class="tab-panel active">
      <div class="controls card">
        <div class="control-group">
          <label class="control-label">How much energy do you have?</label>
          <div id="energy-seg" class="segmented energy-seg" role="radiogroup" aria-label="Energy level"></div>
        </div>

        <div class="control-group">
          <label class="control-label">How do you want to work?</label>
          <div id="medium-seg" class="segmented" role="radiogroup" aria-label="Medium"></div>
        </div>

        <details class="more-options">
          <summary>More options</summary>
          <div class="options-grid">
            <div class="opt">
              <label class="opt-label" for="focus-select">Focus</label>
              <select id="focus-select"></select>
            </div>
            <label class="opt toggle">
              <input type="checkbox" id="challenge-toggle">
              <span>Add a challenge modifier</span>
            </label>
          </div>
        </details>

        <button id="generate-btn" class="btn-primary generate-btn">
          <span class="dice">🔥</span> Assign my task
        </button>
        <button id="lucky-btn" class="lucky-btn">⚡ Feeling lucky — surprise me completely</button>
      </div>

      <!-- Result -->
      <div id="result" class="result hidden">
        <article class="result-card card">
          <div class="result-head">
            <div class="result-meta">
              <span id="r-effort" class="pill pill-effort"></span>
              <span id="r-medium" class="pill"></span>
              <span id="r-duration" class="pill pill-ghost"></span>
            </div>
            <span id="r-category" class="category-tag"></span>
          </div>

          <div class="result-row task-row">
            <div class="row-body">
              <div class="row-kicker">Your task</div>
              <h2 id="r-task" class="task-title"></h2>
            </div>
            <div class="row-actions">
              <button class="lock-btn" data-lock="task" title="Lock this">🔓</button>
              <button class="reroll-btn" data-reroll="task" title="Reroll task">↻</button>
            </div>
          </div>

          <div class="words-row">
            <div class="result-row word-row">
              <div class="row-body">
                <div class="row-kicker">Primary focus word</div>
                <div id="r-primary" class="word primary-word"></div>
              </div>
              <div class="row-actions">
                <button class="lock-btn" data-lock="primary" title="Lock this">🔓</button>
                <button class="reroll-btn" data-reroll="primary" title="Reroll word">↻</button>
              </div>
            </div>
            <div class="result-row word-row">
              <div class="row-body">
                <div class="row-kicker">Secondary word</div>
                <div id="r-secondary" class="word secondary-word"></div>
              </div>
              <div class="row-actions">
                <button class="lock-btn" data-lock="secondary" title="Lock this">🔓</button>
                <button class="reroll-btn" data-reroll="secondary" title="Reroll word">↻</button>
              </div>
            </div>
          </div>

          <div class="result-row palette-row">
            <div class="row-body full">
              <div class="row-kicker">
                Limited palette · <span id="r-palette-type"></span>
                <span id="r-palette-name" class="palette-name"></span>
              </div>
              <div id="r-swatches" class="swatches"></div>
            </div>
            <div class="row-actions">
              <button class="lock-btn" data-lock="palette" title="Lock this">🔓</button>
              <button class="reroll-btn" data-reroll="palette" title="Reroll palette">↻</button>
            </div>
          </div>

          <div id="constraint-row" class="result-row constraint-row hidden">
            <div class="row-body">
              <div class="row-kicker">Challenge</div>
              <div id="r-constraint" class="constraint-text"></div>
            </div>
            <div class="row-actions">
              <button class="lock-btn" data-lock="constraint" title="Lock this">🔓</button>
              <button class="reroll-btn" data-reroll="constraint" title="Reroll challenge">↻</button>
            </div>
          </div>

          <!-- Timer -->
          <div class="timer">
            <div class="timer-display" id="timer-display">00:00</div>
            <div class="timer-controls">
              <button id="timer-start" class="btn-mini">Start timer</button>
              <button id="timer-reset" class="btn-mini ghost">Reset</button>
            </div>
          </div>

          <div class="result-footer">
            <button id="done-btn" class="btn-primary">✓ Mark done</button>
            <button id="fav-btn" class="btn-mini ghost">☆ Save</button>
            <button id="copy-btn" class="btn-mini ghost">⧉ Copy</button>
            <button id="reroll-all-btn" class="btn-mini ghost">🎲 Reroll all</button>
          </div>
        </article>
      </div>

      <p id="empty-hint" class="empty-hint">Pick your energy and medium, then hit <b>Assign my task</b>.</p>
    </section>

    <!-- ============ CALENDAR ============ -->
    <section id="tab-calendar" class="tab-panel">
      <div class="stats-row">
        <div class="stat card"><div class="stat-num" id="stat-streak">0</div><div class="stat-label">🔥 Current streak</div></div>
        <div class="stat card"><div class="stat-num" id="stat-best">0</div><div class="stat-label">Best streak</div></div>
        <div class="stat card"><div class="stat-num" id="stat-week">0</div><div class="stat-label">This week</div></div>
        <div class="stat card"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Total sessions</div></div>
      </div>
      <div class="card cal-card">
        <div class="cal-head">
          <button id="cal-prev" class="btn-mini ghost" aria-label="Previous month">‹</button>
          <div id="cal-title" class="cal-title"></div>
          <button id="cal-next" class="btn-mini ghost" aria-label="Next month">›</button>
        </div>
        <div class="cal-weekdays">
          <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
        </div>
        <div id="cal-grid" class="cal-grid"></div>
      </div>
      <div id="day-detail" class="card day-detail hidden"></div>
    </section>

    <!-- ============ LOG ============ -->
    <section id="tab-log" class="tab-panel">
      <div class="segmented log-seg">
        <button class="log-tab active" data-log="history">History</button>
        <button class="log-tab" data-log="favorites">Favorites</button>
      </div>
      <div id="log-list" class="log-list"></div>
    </section>

    <!-- ============ SETTINGS ============ -->
    <section id="tab-settings" class="tab-panel"></section>
  </main>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- Notes modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-box card">
      <h3 id="modal-title">Add a note</h3>
      <p id="modal-sub" class="modal-sub"></p>
      <textarea id="modal-note" placeholder="How did it go? (optional)"></textarea>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn-mini ghost">Cancel</button>
        <button id="modal-save" class="btn-primary">Save session</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
