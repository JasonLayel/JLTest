# Stores the Anthropic API key as a Firebase secret for the Hearth function.
# Run this by hand after setting or rotating the key, not on every push, so
# that Secret Manager does not collect a new version per deploy.
#
# Repository secrets required:
#   HEARTH_SERVICE_ACCOUNT  the service account JSON for the hearth-companion project
#   ANTHROPIC_API_KEY       the key itself, starting sk-ant-
name: Set Hearth API key

on:
  workflow_dispatch:

jobs:
  setkey:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hearth
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the secrets are present
        env:
          SA: ${{ secrets.HEARTH_SERVICE_ACCOUNT }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::The HEARTH_SERVICE_ACCOUNT repository secret is not set."
            exit 1
          fi
          if [ -z "$KEY" ]; then
            echo "::error::The ANTHROPIC_API_KEY repository secret is not set."
            exit 1
          fi
          case "$KEY" in
            sk-ant-*) echo "Key looks like an Anthropic key." ;;
            *) echo "::error::ANTHROPIC_API_KEY does not start with sk-ant-. Check it was pasted whole."; exit 1 ;;
          esac
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      - name: Install the Firebase CLI
        run: npm install -g firebase-tools@15 --no-audit --no-fund

      - name: Store the key in Secret Manager
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          printf '%s' "$KEY" | firebase functions:secrets:set ANTHROPIC_API_KEY \
            --data-file - --project hearth-companion --non-interactive
          echo "Stored. Now run the 'Deploy Hearth' workflow so the function picks it up."
