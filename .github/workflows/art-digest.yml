# Collects the most popular new digital art (ArtStation, Reddit, Pixiv,
# DeviantArt) and commits the result to art-digest/data/, which the widget at
# /art-digest/ reads and the daily email digest is built from.
#
# The scheduled run only fires from the default branch (GitHub's rule), so the
# daily digest starts once this workflow is on master. Pushes that touch the
# collector run it immediately, and it can always be started by hand.
name: Art digest

on:
  schedule:
    - cron: '5 13 * * *' # 13:05 UTC daily
  workflow_dispatch:
  push:
    paths:
      - 'art-digest/collect.mjs'
      - '.github/workflows/art-digest.yml'

permissions:
  contents: write

concurrency:
  group: art-digest
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test the collector
        run: node art-digest/test/run.mjs

      - name: Collect the digest
        env:
          # Optional: Reddit's public JSON throttles datacenter IPs, so the
          # collector uses app-only OAuth when these secrets exist.
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: node art-digest/collect.mjs

      - name: Summarize the run
        run: |
          node -e '
            const d = require("./art-digest/data/latest.json");
            const out = [];
            out.push(`## 🎨 ${d.items.length} picks · ${new Date(d.generatedAt).toUTCString()}`, "");
            for (const s of d.sources) {
              out.push(`- ${s.status === "ok" ? "✅" : "❌"} **${s.label}** — ${s.status === "ok" ? `${s.kept} kept of ${s.fetched}${s.note ? ` (${s.note})` : ""}` : s.error}`);
            }
            out.push("", "| # | Source | Piece | Artist | Heat |", "|---|---|---|---|---|");
            d.items.slice(0, 10).forEach((i, n) => {
              const cell = (t) => String(t ?? "").replace(/\|/g, "\\|").slice(0, 60);
              out.push(`| ${n + 1} | ${cell(d.sourceLabels[i.source] || i.source)} | [${cell(i.title)}](${i.url}) | ${cell(i.artist)} | ${i.heat} |`);
            });
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
          '

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: art-digest
          path: |
            art-digest/data/latest.json
            art-digest/data/email.html
          retention-days: 14

      - name: Commit the digest
        run: |
          set -euo pipefail
          git config user.name 'art-digest'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add art-digest/data
          if git diff --cached --quiet; then
            echo 'No change in the digest; nothing to commit.'
            exit 0
          fi
          count=$(node -p 'require("./art-digest/data/latest.json").items.length')
          git commit -m "Art digest: ${count} picks for $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); rebasing on the remote branch."
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $((attempt * 5))
          done
          echo 'Could not push the digest.' >&2
          exit 1
