# Deploys Hearth to Firebase from GitHub, so nothing has to be installed or
# run on a local machine.
#
# Repository secrets required:
#   HEARTH_SERVICE_ACCOUNT  the service account JSON for the hearth-companion project
#   ANTHROPIC_API_KEY       the key itself, starting sk-ant-
#
# The key is stored in Secret Manager here, but only when it is not already
# there, so repeated deploys do not pile up secret versions. To rotate it,
# use hearth-set-key.yml once these workflows reach the default branch
# (workflow_dispatch only works from there).
name: Deploy Hearth

on:
  push:
    branches: [master, ccr-52eee7cf-dyvxb5]
    paths:
      - 'hearth/**'
      - '.github/workflows/hearth-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hearth
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Write service account credentials
        env:
          SA: ${{ secrets.HEARTH_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::The HEARTH_SERVICE_ACCOUNT repository secret is not set. See hearth/SETUP.md."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/sa.json', 'utf8')); console.log('service account JSON is valid')"

      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Install the Firebase CLI
        run: npm install -g firebase-tools@15 --no-audit --no-fund

      - name: Store the Anthropic key if it is not stored yet
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # "describe" only proves the secret container exists. A container with
          # no version is exactly what a failed earlier attempt leaves behind,
          # and the deploy then fails on "no latest version". "access" reads the
          # latest value, so it is the question actually worth asking.
          if firebase functions:secrets:access ANTHROPIC_API_KEY \
               --project hearth-companion --non-interactive >/dev/null 2>&1; then
            echo "Secret already has a value. Leaving it alone."
            exit 0
          fi
          echo "No usable secret version. Storing the key."
          if [ -z "$KEY" ]; then
            echo "::error::No secret stored yet and the ANTHROPIC_API_KEY repository secret is not set."
            exit 1
          fi
          case "$KEY" in
            sk-ant-*) : ;;
            *) echo "::error::ANTHROPIC_API_KEY does not start with sk-ant-. Check it was pasted whole."; exit 1 ;;
          esac
          printf '%s' "$KEY" | firebase functions:secrets:set ANTHROPIC_API_KEY \
            --data-file - --project hearth-companion --non-interactive
          echo "Stored."

      - name: Deploy functions and hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        # --force also accepts the artifact cleanup policy. Without it the CLI
        # deploys successfully and then exits non-zero because it cannot
        # prompt, which reads as a failed deploy. The policy is wanted anyway:
        # it stops old container images accumulating and costing money.
        run: firebase deploy --only functions,hosting --project hearth-companion --non-interactive --force

      - name: Where it went
        run: echo "Live at https://hearth-companion.web.app"
